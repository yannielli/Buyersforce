{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-head">
      <h1 style="font-size:24px;">Welcome back</h1>
      <p style="margin:0;">Log in to your BuyersForce workspace.</p>
    </div>
    <form method="post">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autofocus placeholder="you@company.com">
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••">
      </div>
      <button class="btn btn-primary btn-block btn-lg" type="submit">Log in</button>
    </form>
    <p style="text-align:center; margin-top:16px; font-size:13.5px;">Don't have an account yet?
      <a href="{{ url_for('signup') }}" style="color:var(--brand); font-weight:600;">Learn how to get access</a></p>
  </div>
</div>
{% endblock %}
