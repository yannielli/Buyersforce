{% extends "base.html" %}
{% block title %}Support{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <span class="eyebrow">We're here to help</span>
    <h1>Contact support</h1>
    <p class="lede">Tell us what's going on — a BuyersForce admin will follow up with you right
      here, in Messages.</p>
  </div>
  <a href="{{ url_for('support_history') }}" class="btn btn-ghost btn-sm">Your past requests</a>
</div>

<div class="card" style="max-width:640px;">
  <form method="post">
    <div class="field">
      <label>What do you need help with?</label>
      <select name="category" required>
        <option value="" disabled selected>Choose a category</option>
        {% for value, label in categories %}
        <option value="{{ value }}">{{ label }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="field">
      <label>Details</label>
      <textarea name="notes" style="min-height:150px;"
        placeholder="What happened, what you expected instead, and anything else that would help us look into it."
        required></textarea>
    </div>
    <button class="btn btn-primary btn-block" type="submit">Send to BuyersForce support</button>
  </form>
</div>
{% endblock %}
