{% extends "base.html" %}
{% block title %}Edit {{ u.name }}{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <span class="eyebrow">Administrator</span>
    <h1>Edit account details</h1>
    <p class="lede">Changes save immediately.</p>
  </div>
  <a href="{{ url_for('admin_user_detail', user_id=u.id) }}" class="btn btn-ghost btn-sm">← Back to {{ u.name }}</a>
</div>

<div class="card" style="max-width:520px;">
  <form method="post">
    <div class="field"><label>Name</label><input type="text" name="name" value="{{ u.name }}" required></div>
    <div class="field"><label>Email</label><input type="email" name="email" value="{{ u.email }}" required></div>
    <div class="field"><label>Company</label><input type="text" name="company" value="{{ u.company }}" required></div>
    <div class="field"><label>Title</label><input type="text" name="title" value="{{ u.title or '' }}"></div>
    <button class="btn btn-primary" type="submit">Save changes</button>
  </form>
</div>
{% endblock %}
