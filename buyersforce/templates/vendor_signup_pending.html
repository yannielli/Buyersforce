{% extends "base.html" %}
{% block title %}Request received{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="auth-card" style="text-align:center;">
    <div class="icon" style="font-size:40px; margin-bottom:8px;">✅</div>
    <h1 style="font-size:22px;">Thank you!</h1>
    <p>We received your request to list <strong>{{ company_name }}</strong> on BuyersForce. You'll
      be contacted by a BuyersForce admin shortly.</p>
    <a href="{{ url_for('landing') }}" class="btn btn-secondary" style="margin-top:12px;">Back to home</a>
  </div>
</div>
{% endblock %}
