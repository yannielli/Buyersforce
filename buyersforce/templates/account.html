{% extends "base.html" %}
{% block title %}Account settings{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <span class="eyebrow">Account</span>
    <h1>{{ g.user.name }}</h1>
    <p class="lede">{{ g.user.email }} · {{ g.user.company }}{% if g.user.is_admin %} · Administrator{% endif %}</p>
  </div>
</div>

<div class="card" style="max-width:480px;">
  <h3 style="font-size:15px;">Change password</h3>
  <form method="post">
    <div class="field">
      <label for="current_password">Current password</label>
      <input type="password" id="current_password" name="current_password" required>
    </div>
    <div class="field">
      <label for="new_password">New password</label>
      <input type="password" id="new_password" name="new_password" required minlength="8" placeholder="At least 8 characters">
    </div>
    <div class="field">
      <label for="confirm">Confirm new password</label>
      <input type="password" id="confirm" name="confirm" required minlength="8">
    </div>
    <button class="btn btn-primary" type="submit">Update password</button>
  </form>
</div>
{% endblock %}
